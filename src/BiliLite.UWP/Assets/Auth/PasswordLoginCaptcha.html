<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证</title>
    <style>body{font-family:Segoe UI,sans-serif;text-align:center}#captcha{margin:24px auto}</style>
</head>
<body>
    <div id="captcha"><p>完成验证后继续登录</p></div>
    <script src="../JiYan/极验_files/gt.js"></script>
    <script>
        function queryValue(name) {
            var parts = window.location.search.substring(1).split('&');
            for (var i = 0; i < parts.length; i++) {
                var separator = parts[i].indexOf('=');
                if (separator < 0) continue;
                if (decodeURIComponent(parts[i].substring(0, separator).replace(/\+/g, ' ')) === name)
                    return decodeURIComponent(parts[i].substring(separator + 1).replace(/\+/g, ' '));
            }
            return '';
        }
        function report(values) {
            var query = Object.keys(values).map(function (key) {
                return encodeURIComponent(key) + '=' + encodeURIComponent(values[key] || '');
            }).join('&');
            window.location.href = 'http://geetest.result/?' + query + '&app=uwp';
        }
        window.onload = function () {
            initGeetest({
                gt: queryValue('gee_gt'),
                challenge: queryValue('gee_challenge'),
                offline: false,
                new_captcha: true,
                product: 'popup',
                width: '300px',
                https: true
            }, function (captcha) {
                captcha.appendTo('#captcha');
                captcha.onSuccess(function () {
                    var result = captcha.getValidate();
                    report({
                        success: '1',
                        operation: queryValue('operation'),
                        recaptcha_token: queryValue('recaptcha_token'),
                        geetest_challenge: result.geetest_challenge,
                        geetest_validate: result.geetest_validate,
                        geetest_seccode: result.geetest_seccode
                    });
                });
                captcha.onError(function () { report({ success: '0', operation: queryValue('operation') }); });
                captcha.onClose(function () { report({ success: '2', operation: queryValue('operation') }); });
            });
        };
    </script>
</body>
</html>
